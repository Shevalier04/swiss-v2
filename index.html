<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      // Suppress harmless Vite HMR WebSocket closing messages in cloud sandbox iframe
      window.addEventListener('unhandledrejection', function (e) {
        if (e && e.reason && String(e.reason.message || e.reason).includes('WebSocket')) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        if (e && e.message && String(e.message).includes('WebSocket')) {
          e.preventDefault();
        }
      });
      const _origConsoleError = console.error;
      console.error = function (...args) {
        if (typeof args[0] === 'string' && (args[0].includes('[vite] WebSocket') || args[0].includes('WebSocket closed'))) {
          return;
        }
        _origConsoleError.apply(console, args);
      };
    </script>
    <title>掌上课表 · Swiss Editorial</title>
